[package]
name = "verify-3m-cert"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "verify_3m_rust"
path = "verify_3m_rust.rs"

[dependencies]
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
overflow-checks = true
